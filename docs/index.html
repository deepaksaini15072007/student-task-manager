
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Student Task Manager</h1>
        <p>Manage your assignments, projects and deadlines</p>
    </header>

    <main>

        <!-- Dashboard -->
<section class="dashboard">

    <div class="card stat-blue">
        <div class="stat-top">
            <span class="stat-icon">▤</span>
            <span class="stat-label">Total Tasks</span>
        </div>
        <p id="totalTasks">0</p>
        <small>All your tasks</small>
    </div>

    <div class="card stat-green">
        <div class="stat-top">
            <span class="stat-icon">✓</span>
            <span class="stat-label">Completed</span>
        </div>
        <p id="completedTasks">0</p>
        <small>Tasks completed</small>
    </div>

    <div class="card stat-orange">
        <div class="stat-top">
            <span class="stat-icon">◷</span>
            <span class="stat-label">Pending</span>
        </div>
        <p id="pendingTasks">0</p>
        <small>Tasks remaining</small>
    </div>

    <div class="card stat-pink">
        <div class="stat-top">
            <span class="stat-icon">▥</span>
            <span class="stat-label">Progress</span>
        </div>

        <div class="progress-ring" id="progressRing">
            <span id="progress">0%</span>
        </div>

        <small>Keep going!</small>
    </div>

</section>


        <!-- Add New Task -->
        <section class="add-task">

            <h2>Add New Task</h2>

            <input
                type="text"
                id="taskName"
                placeholder="Enter task name"
                aria-label="Task name"
                maxlength="200"
            >

            <input
                type="date"
                id="taskDate"
                aria-label="Task deadline"
            >

            <select
                id="taskPriority"
                aria-label="Select task priority"
            >
                <option value="High">High Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="Low">Low Priority</option>
            </select>

            <button type="button" onclick="addTask()">
                + Add Task
            </button>

        </section>


        <!-- My Tasks -->
        <section class="tasks">

            <h2>My Tasks</h2>

            <!-- Search and Filters -->
            <div class="filters">

                <input
                    type="search"
                    id="searchTask"
                    placeholder="Search tasks..."
                    aria-label="Search tasks"
                    oninput="filterTasks()"
                >

                <select
                    id="filterPriority"
                    aria-label="Filter tasks"
                    onchange="filterTasks()"
                >
                    <option value="All">All Tasks</option>
                    <option value="Pending">Pending Tasks</option>
                    <option value="Completed">Completed Tasks</option>
                    <option value="High">High Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>

            </div>

            <!-- Task List -->
            <div id="taskList" aria-live="polite">
                <!-- Tasks will be added using JavaScript -->
            </div>

        </section>

    </main>

</body>
</html>
